   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54813f" x="22.968" y="174.691698" transform="rotate(-0 22.968 174.691698)">Visual</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="96.2892" y="176.347323" transform="rotate(-0 96.2892 176.347323)">subtle facial evidence</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="22.4658" y="189.336226" transform="rotate(-0 22.4658 189.336226)">Illustrative MOSI-style example (not a verbatim dataset sample)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 5.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(228.906834 66.637987)">C4-Explicit rewrite</text>
    <text style="font-weight: 700; font-size: 5.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(199.511311 72.426375)">“The sequel was deeply disappointing.</text>
    <text style="font-weight: 700; font-size: 5.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(208.0311 78.254607)">Its incoherent story, poor acting,</text>
    <text style="font-weight: 700; font-size: 5.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(202.378866 84.082839)">and ruined ending made the speaker</text>
    <text style="font-weight: 700; font-size: 5.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(227.727061 89.911072)">strongly dislike it.”</text>
   </g>
