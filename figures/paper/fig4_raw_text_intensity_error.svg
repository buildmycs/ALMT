   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172033" x="28.9944" y="19.460313" transform="rotate(-0 28.9944 19.460313)">Correct polarity, wrong sentiment intensity</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="28.9944" y="28.388171" transform="rotate(-0 28.9944 28.388171)">Under-specified target wording compresses a strongly negative opinion into a mild negative class.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="22.4658" y="45.244528" transform="rotate(-0 22.4658 45.244528)">LOCAL DISCOURSE CONTEXT</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172033" x="26.9856" y="67.586992" transform="rotate(-0 26.9856 67.586992)">Turn -2   “I had waited months for this sequel.”</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(38.7873 93.894539)">Turn -1   “The story made no sense. The acting was painful.</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(38.7873 99.966672)">The ending ruined the entire series.”</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.55px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172033" x="26.9856" y="133.062937" transform="rotate(-0 26.9856 133.062937)">Target      “I did not really enjoy it.”</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #27806e" x="22.968" y="156.647547" transform="rotate(-0 22.968 156.647547)">Audio</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="96.2892" y="158.826191" transform="rotate(-0 96.2892 158.826191)">restrained prosody</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54813f" x="22.968" y="174.691698" transform="rotate(-0 22.968 174.691698)">Visual</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="96.2892" y="176.347323" transform="rotate(-0 96.2892 176.347323)">subtle facial evidence</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="22.4658" y="189.336226" transform="rotate(-0 22.4658 189.336226)">Illustrative MOSI-style example (not a verbatim dataset sample)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(222.14323 71.314028)">Surface wording</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(212.928894 78.285051)">“did not really enjoy”</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(223.165456 85.256074)">→ mild negative</text>
   </g>
   <g id="text_14">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(209.552878 114.355167)">Contextual intensity omitted</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(218.210644 120.824542)">months of anticipation</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(213.570488 127.293917)">+ multiple severe failures</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(220.735144 156.723492)">Polarity is negative,</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(227.829206 163.533361)">but its severity</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(226.329675 170.34323)">remains implicit</text>
   </g>
