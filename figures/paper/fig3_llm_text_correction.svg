   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172033" x="28.9944" y="19.460313" transform="rotate(-0 28.9944 19.460313)">C4-Explicit enhancement restores the intended polarity</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="28.9944" y="28.388171" transform="rotate(-0 28.9944 28.388171)">Context-grounded rewriting resolves reference, disambiguates pragmatics, and states the implicit sentiment.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="22.4658" y="45.244528" transform="rotate(-0 22.4658 45.244528)">LOCAL DISCOURSE CONTEXT</text>
