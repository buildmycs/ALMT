   <g id="text_13">
    <text style="font-weight: 700; font-size: 4.75px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(230.730936 66.986207)">C4-Explicit rewrite</text>
    <text style="font-weight: 700; font-size: 4.75px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(218.56908 72.377353)">“‘That’ refers to the movie.</text>
    <text style="font-weight: 700; font-size: 4.75px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(212.696522 77.768499)">‘Great’ is sarcastic; the speaker</text>
