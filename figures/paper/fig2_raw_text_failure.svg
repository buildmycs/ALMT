   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54813f" x="22.968" y="173.122642" transform="rotate(-0 22.968 173.122642)">Visual</text>
   </g>
   <g id="text_11">
