   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172033" x="28.9944" y="19.460313" transform="rotate(-0 28.9944 19.460313)">Surface text can reverse the predicted polarity</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="28.9944" y="28.388171" transform="rotate(-0 28.9944 28.388171)">Unresolved reference and implicit sarcasm make a negative utterance appear positive.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #59657a" x="22.4658" y="45.244528" transform="rotate(-0 22.4658 45.244528)">LOCAL DISCOURSE CONTEXT</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.45px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172033" x="26.9856" y="67.68357" transform="rotate(-0 26.9856 67.68357)">Turn -2   “The trailer looked exciting.”</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(38.7873 92.368328)">Turn -1   “But the plot went nowhere.</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #172033" transform="translate(38.7873 99.291694)">I kept checking the time.”</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172033" x="26.9856" y="130.488647" transform="rotate(-0 26.9856 130.488647)">Target      “Yeah, that was just great.”</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #27806e" x="22.968" y="154.555472" transform="rotate(-0 22.968 154.555472)">Audio</text>
   </g>
   <g id="text_9">
