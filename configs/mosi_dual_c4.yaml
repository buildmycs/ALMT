base:
  project_name: ALMT_MOSI_Dual_C4
  ckpt_root: ./ckpt
  seed: 7
  lr: 0.0001
  weight_decay: 0.0001
  # Shared BERT sees 2 * batch_size sequences. Start at 32 on the RTX 5090.
  batch_size: 32
  n_epochs: 200
  num_workers: 8
  gpu_id: 0

dataset:
  datasetName: mosi
  dataPath: ./datasets/mosi/unaligned_50_dual_qwen25_c4.pkl
  train_mode: regression

model:
  bert_pretrained: ./pretrained/bert-base-uncased

  # Projection Layer Parameters
  l_input_dim: 768
  a_input_dim: 5
  v_input_dim: 20
  l_proj_dst_dim: 128
  a_proj_dst_dim: 128
  v_proj_dst_dim: 128

  # Transformer Parameters
  token_len: 8
  token_dim: 128
  l_input_length: 50
  a_input_length: 375
  v_input_length: 500
  proj_input_dim: 128
  proj_depth: 1
  proj_heads: 8
  proj_mlp_dim: 128

  # Dual Text Parameters
  # Options: gated_cross, mean, original, enhanced.
  dual_fusion_mode: gated_cross
  dual_cross_heads: 8
  dual_cross_dropout: 0.1
  # sigmoid(-2) is about 0.119, so enhanced semantics enter gradually.
  dual_scale_logit_init: -2.0

  # Text Encoder Parameters
  token_length: 8
  l_enc_heads: 8
  l_enc_mlp_dim: 128

  # H Hyper Layer Parameters
  AHL_depth: 3
  ahl_heads: 8
  ahl_dim_head: 16
  ahl_droup: 0.

  # Fusion Layer Parameters
  fusion_heads: 8
  fusion_mlp_dim: 128
  fusion_layer_depth: 2
